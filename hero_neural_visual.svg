<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .orbit { transform-origin: 300px 300px; animation: spin 25s linear infinite; }
    .orbit-reverse { transform-origin: 300px 300px; animation: spin-rev 35s linear infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 0.9; transform: scale(1.02); } }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
  </style>

  <!-- Ambient Backdrop Glow -->
  <circle cx="300" cy="300" r="220" fill="url(#coreGrad)" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="300" cy="300" r="160" fill="url(#tealGrad)" opacity="0.08" filter="url(#softGlow)" />

  <!-- Outer Tech Orbit Rings -->
  <circle cx="300" cy="300" r="240" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6, 8" opacity="0.6" />
  <circle cx="300" cy="300" r="190" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4, 12" opacity="0.7" />
  <circle cx="300" cy="300" r="130" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Orbiting Satellites / Nodes -->
  <g class="orbit">
    <circle cx="300" cy="60" r="8" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="540" cy="300" r="6" fill="#818CF8" filter="url(#glow)" />
    <circle cx="300" cy="540" r="7" fill="#2DD4BF" filter="url(#glow)" />
    <circle cx="60" cy="300" r="5" fill="#C084FC" filter="url(#glow)" />
  </g>

  <g class="orbit-reverse">
    <circle cx="434" cy="166" r="6" fill="#F472B6" filter="url(#glow)" />
    <circle cx="434" cy="434" r="5" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="166" cy="434" r="7" fill="#34D399" filter="url(#glow)" />
    <circle cx="166" cy="166" r="6" fill="#A78BFA" filter="url(#glow)" />
  </g>

  <!-- Neural Network Interconnect Web -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.4">
    <line x1="300" y1="200" x2="230" y2="260" />
    <line x1="300" y1="200" x2="370" y2="260" />
    <line x1="230" y1="260" x2="250" y2="350" />
    <line x1="370" y1="260" x2="350" y2="350" />
    <line x1="250" y1="350" x2="300" y2="400" />
    <line x1="350" y1="350" x2="300" y2="400" />
    <line x1="230" y1="260" x2="370" y2="260" />
    <line x1="250" y1="350" x2="350" y2="350" />
    <line x1="300" y1="200" x2="300" y2="300" />
    <line x1="300" y1="300" x2="300" y2="400" />
  </g>

  <!-- Central Quantum Brain / AI Core Hexagon -->
  <g class="pulse" transform-origin="300 300">
    <polygon points="300,230 360,265 360,335 300,370 240,335 240,265" 
             fill="url(#bgGrad)" stroke="url(#coreGrad)" stroke-width="3" filter="url(#glow)" />
    <!-- Core Center Icon -->
    <circle cx="300" cy="300" r="28" fill="url(#coreGrad)" />
    <path d="M290 290 L310 290 L310 310 L290 310 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="300" cy="300" r="6" fill="#FFFFFF" />
  </g>

  <!-- Neural Nodes -->
  <circle cx="300" cy="200" r="7" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="230" cy="260" r="7" fill="#818CF8" filter="url(#glow)" />
  <circle cx="370" cy="260" r="7" fill="#C084FC" filter="url(#glow)" />
  <circle cx="250" cy="350" r="7" fill="#2DD4BF" filter="url(#glow)" />
  <circle cx="350" cy="350" r="7" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="300" cy="400" r="7" fill="#F472B6" filter="url(#glow)" />

  <!-- Floating Glass Badges -->
  <g class="float" transform="translate(0, 0)">
    <!-- Badge 1: 6 Builds Verified -->
    <rect x="70" y="110" width="160" height="42" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="92" cy="131" r="5" fill="#10B981" />
    <text x="108" y="136" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">6 Builds Verified</text>
    
    <!-- Badge 2: Prompt Chain Engine -->
    <rect x="370" y="440" width="180" height="42" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="392" cy="461" r="5" fill="#818CF8" />
    <text x="408" y="466" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">10-Step Prompt Chain</text>

    <!-- Badge 3: 4-Tier AI OS -->
    <rect x="380" y="120" width="160" height="42" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="402" cy="141" r="5" fill="#38BDF8" />
    <text x="418" y="146" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">4-Tier AI OS Core</text>
  </g>
</svg>
